name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        go:
          - "1.26"
          - "1.27"
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
        id: go

      - name: Build & Test
        run: |
          go test -race ./...

  # The acceptance test: a real Ceph RGW doing SSE-KMS and SSE-S3 against
  # transhim (integration/), on every Ceph release that is supported. Squid
  # is the one that needs key writes answered without a body.
  integration:
    name: Integration (Ceph ${{ matrix.ceph }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the image pinned in compose.yml, which dependabot keeps current
          - ceph: compose default
            image: ""
          - ceph: umbrella
            image: quay.io/ceph/ceph:v21.2.0
          - ceph: squid
            image: quay.io/ceph/ceph:v19.2.7
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: integration/go.sum

      - name: Start Ceph RGW
        run: |
          docker compose up -d --wait ceph
          docker compose exec -T ceph ceph --version
        env:
          CEPH_IMAGE: ${{ matrix.image }}

      - name: Integration Test
        working-directory: integration
        run: |
          go test -race -count=1 -v ./...
        env:
          TRANSHIM_TEST_RGW_ENDPOINT: http://127.0.0.1:7480

      - name: Ceph logs
        if: ${{ failure() }}
        run: |
          docker compose logs --tail 200 ceph

  # sops as a second Transit client (integration/, TestSops).
  sops:
    name: Interop (sops)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: integration/go.sum

      # sops, pinned in mise.toml
      - name: Set up mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: sops version
        run: |
          sops --version --disable-version-check

      - name: Interop Test
        working-directory: integration
        run: |
          go test -race -count=1 -v -run 'TestSops' ./...

  # The AWS KMS example, tested against the AWS Emulator.
  awskms:
    name: AWS KMS example
    runs-on: ubuntu-latest
    env:
      # https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/versions.json
      AWS_EMULATOR_VERSION: "1.0.486"
      AWS_EMULATOR_KEY_FINGERPRINT: 98BCF336A3BE53B734E967C52E5BF49BD940F624
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: examples/awskms/go.sum

      - name: Start AWS Emulator
        run: |
          base=https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS
          deb="aws-emulator_${AWS_EMULATOR_VERSION}-1_amd64.deb"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$deb"
          curl -fsSLO "$base/$deb.sig"
          curl -fsSLo aws-emulator-key.asc https://downloads.aws.com/keys/gpg/current.asc
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --quiet --import aws-emulator-key.asc
          gpg --batch --status-fd 1 --verify "$deb.sig" "$deb" \
            | grep -q "^\[GNUPG:\] VALIDSIG .* ${AWS_EMULATOR_KEY_FINGERPRINT}\$"
          sudo apt-get install -y "./$deb"
          aws-emulator -v
          nohup aws-emulator --telemetry off --auth off > aws-emulator.log 2>&1 &
          ca="$HOME/.aws/emulator/9297/ca.pem"
          for _ in $(seq 1 30); do
            if curl -fs --cacert "$ca" https://127.0.0.1:9297/__admin/health; then
              echo "AWS_CA_BUNDLE=$ca" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat aws-emulator.log
          exit 1

      - name: Build & Test
        working-directory: examples/awskms
        run: |
          go build ./...
          go test -race -count=1 -v ./...
        env:
          TRANSHIM_TEST_KMS_ENDPOINT: https://127.0.0.1:9297

  # The SAKURA Cloud KMS example, tested against sakumock in-process.
  sakurakms:
    name: SAKURA Cloud KMS example
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: examples/sakurakms/go.sum

      - name: Build & Test
        working-directory: examples/sakurakms
        run: |
          go build ./...
          go test -race -count=1 -v ./...

  # The SQL key store example, tested against SQLite and a real PostgreSQL.
  sqlkeystore:
    name: SQL key store example
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: examples/sqlkeystore/go.sum

      - name: Start PostgreSQL
        run: |
          docker compose up -d --wait postgres

      - name: Build & Test
        working-directory: examples/sqlkeystore
        run: |
          go build ./...
          go test -race -count=1 -v ./...
        env:
          TRANSHIM_TEST_POSTGRES_DSN: postgres://transhim:transhim@127.0.0.1:15432/transhim
