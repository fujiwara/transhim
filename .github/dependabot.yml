version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    groups:
      aws-sdk-go-v2:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
  # the acceptance test against Ceph RGW, a module of its own
  - package-ecosystem: gomod
    directory: "/integration"
    schedule:
      interval: monthly
    groups:
      aws-sdk-go-v2:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
          - "github.com/aws/smithy-go"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  # the development backends in compose.yml
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # a Ceph major needs docker/ceph-demo.sh changes, and its x.1 releases
      # are RCs the tag cannot tell apart: bump it by hand
      - dependency-name: "ceph/ceph"
        update-types: ["version-update:semver-major"]
