# Development and compatibility-capture environment. The layout follows
# fujiwara/s3rp: image tags are pinned and bumped by dependabot
# (docker-compose ecosystem), which reads and rewrites the ${VAR:-default}
# forms below.
services:
  # Reference Transit implementation, in dev mode (in-memory, unsealed).
  # start explicitly: docker compose up -d --wait openbao
  openbao:
    image: ${OPENBAO_IMAGE:-openbao/openbao:2.7.2}
    profiles: [openbao]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-transhim-dev-token}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      BAO_ADDR: http://127.0.0.1:8200
      # dev mode needs no mlock, so no IPC_LOCK capability either
      SKIP_SETCAP: "true"
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Database for the SQL key store example (examples/sqlkeystore).
  # start explicitly: docker compose up -d --wait postgres
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.1}
    profiles: [postgres]
    environment:
      POSTGRES_USER: transhim
      POSTGRES_PASSWORD: transhim
      POSTGRES_DB: transhim
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "transhim", "-d", "transhim"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Ceph RGW with SSE-KMS and SSE-S3 pointed at a Vault Transit endpoint
  # (RGW_VAULT_ADDR: the recording proxy for captures, transhim for tests).
  # start explicitly: docker compose up -d --wait ceph
  # NOTE: access RGW via http://127.0.0.1:7480 (not localhost) — RGW
  # resolves non-matching Host names as virtual-hosted bucket names.
  # quay.io/ceph/demo stopped being published after squid, so the release
  # image is bootstrapped by docker/ceph-demo.sh (a trimmed port of the
  # demo entrypoint: mon + mgr + one OSD + RGW + admin user).
  ceph:
    image: ${CEPH_IMAGE:-quay.io/ceph/ceph:v20.2.5}
    profiles: [ceph]
    network_mode: host
    entrypoint: ["/ceph-demo.sh"]
    volumes:
      - ./docker/ceph-demo.sh:/ceph-demo.sh:ro
    environment:
      MON_IP: 127.0.0.1
      CEPH_PUBLIC_NETWORK: 127.0.0.1/32
      CEPH_DEMO_UID: demo
      CEPH_DEMO_ACCESS_KEY: backendkey
      CEPH_DEMO_SECRET_KEY: backendsecret
      RGW_FRONTEND_PORT: 7480
      RGW_VAULT_TOKEN: ${VAULT_TOKEN:-transhim-dev-token}
      # SSE over plain http (RGW requires TLS for SSE by default). SSE-KMS
      # and SSE-S3 use separate Transit mounts, so the two key namespaces
      # (client-supplied key IDs vs. per-bucket keys) never mix.
      # CEPH_EXTRA_ARGS is for local needs, e.g. --mon_data_avail_crit=1
      # when the host disk is nearly full (the mon refuses to start below 5%).
      CEPH_ARGS: >-
        --rgw_crypt_require_ssl=false
        --rgw_crypt_s3_kms_backend=vault
        --rgw_crypt_vault_auth=token
        --rgw_crypt_vault_token_file=/etc/ceph/vault.token
        --rgw_crypt_vault_addr=${RGW_VAULT_ADDR:-http://127.0.0.1:8201}
        --rgw_crypt_vault_prefix=/v1/transit-kms
        --rgw_crypt_vault_secret_engine=transit
        --rgw_crypt_sse_s3_backend=vault
        --rgw_crypt_sse_s3_vault_auth=token
        --rgw_crypt_sse_s3_vault_token_file=/etc/ceph/vault.token
        --rgw_crypt_sse_s3_vault_addr=${RGW_VAULT_ADDR:-http://127.0.0.1:8201}
        --rgw_crypt_sse_s3_vault_prefix=/v1/transit-sse-s3
        --rgw_crypt_sse_s3_vault_secret_engine=transit
        ${CEPH_EXTRA_ARGS:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:7480/"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
